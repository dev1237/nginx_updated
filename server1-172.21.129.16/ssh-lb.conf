# =============================================================================
#  /etc/nginx/stream.conf.d/ssh-lb.conf
#  Included from inside the stream {} block of /etc/nginx/nginx.conf, so this
#  file must NOT wrap itself in "stream { }" and must NOT repeat load_module.
#
#  !! Confirm the nginx host's own IP with `ip -4 addr show`. Your message said
#  !! 172.21.128.138 in places; every file here uses 172.21.129.138.
# =============================================================================

upstream ssh_pool {
    # Shared memory zone: without it max_conns counts per worker process,
    # so "5" would really mean 5 x number-of-workers before overflow.
    zone ssh_pool 64k;

    # Primary -- the box nginx itself runs on. sshd moved to :2222 because
    # nginx owns :22 here. Max 5 simultaneous connections per task requirement.
    server 127.0.0.1:2222 max_conns=5 max_fails=3 fail_timeout=30s;

    # Overflow -- taken only when the primary is at 5 live sessions or is down.
    # Plain round-robin would split traffic 50/50 from the first connection;
    # "backup" is what produces fill-then-spill. Server 2's sshd runs on its
    # normal port 22 (never moved), so this must point at :22, not :2222.
    server 172.21.129.138:22 backup max_fails=3 fail_timeout=30s;
}

server {
    listen 22 so_keepalive=on;
    proxy_pass ssh_pool;

    proxy_connect_timeout 5s;

    # Idle timeout for an established SSH session.
    proxy_timeout 1h;
}
